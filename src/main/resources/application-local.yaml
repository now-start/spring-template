spring:
  cloud:
    config:
      enabled: false
    discovery:
      enabled: false
  datasource:
    url: "jdbc:h2:mem:spring;MODE=MariaDB;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE"
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
      settings:
        web-allow-others: false
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true

eureka:
  client:
    enabled: false

otel:
  sdk:
    disabled: true

logging:
  level:
    org.hibernate.SQL: debug
